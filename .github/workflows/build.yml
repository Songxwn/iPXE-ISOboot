name: build
on:
  push:
    branches: [ "**" ]
    tags-ignore: [ "v*" ]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: false
      - name: go vet
        run: go vet ./...
      - name: Build (all platforms smoke test)
        run: |
          set -e
          for t in "linux/amd64" "linux/arm64" "windows/amd64" "darwin/amd64" "darwin/arm64"; do
            os="${t%/*}"; arch="${t#*/}"
            echo "==> $os/$arch"
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -o /tmp/ipxe-isoboot .
          done
          echo "所有平台编译通过"
