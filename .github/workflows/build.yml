name: build

# 每次推送与 PR 都编译，验证代码可通过。
on:
  push:
    branches: [ "**" ]
    tags-ignore: [ "v*" ]   # tag 由 release.yml 处理
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.22'
          cache: false   # 项目零依赖，无 go.sum，关闭缓存以消除告警

      - name: go vet
        run: go vet ./...

      - name: Build (all platforms smoke test)
        run: |
          set -e
          for target in \
            "linux/amd64" "linux/arm64" \
            "windows/amd64" \
            "darwin/amd64" "darwin/arm64"; do
            os="${target%/*}"; arch="${target#*/}"
            echo "==> building $os/$arch"
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -o /tmp/ipxe-isoboot .
          done
          echo "所有平台编译通过"
